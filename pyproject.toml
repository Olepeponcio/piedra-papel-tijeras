[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "piedra-papel-tijeras"
version = "2.0.0"
description = "Aplicación con interfaz gráfica para jugar a Piedra, Papel o Tijeras"
readme = "README.md"
requires-python = ">=3.14"

keywords = [
    "python",
    "cli",
    "juego",
    "piedra-papel-tijeras",
    "gui",
    "pyside6",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
]


dependencies = ["PySide6==6.11.1",]


[project.optional-dependencies]
dev = [
    "pyinstaller==6.22.0",
    "pytest==9.1.1",
    "ruff==0.16.1",
    "mypy==2.3.0",
    "PySide6==6.11.1",
    "pip-audit==2.10.1",
]

[project.scripts]
piedra-papel-tijeras = "piedra_papel_tijeras.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["piedra_papel_tijeras*"]
namespaces = false

[tool.setuptools.package-data]
piedra_papel_tijeras = ["resources/*.png"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-ra"


[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]


[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
