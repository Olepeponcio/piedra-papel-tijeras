<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de clases modular de piedra, papel y tijeras</title>
  <desc id="desc">Modelo UML con herencia para jugadas y jugadores, además de las relaciones con partida y resultado.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #172033; }
      .box { fill: #f7f9fc; stroke: #385170; stroke-width: 2; }
      .abstract { fill: #e8eef8; stroke: #385170; stroke-width: 2; }
      .enum { fill: #fff4d6; stroke: #b7791f; stroke-width: 2; }
      .name { font-size: 20px; font-weight: 700; text-anchor: middle; }
      .stereotype { font-size: 14px; font-style: italic; text-anchor: middle; }
      .member { font-size: 15px; }
      .divider { stroke: #385170; stroke-width: 1.5; }
      .relation { fill: none; stroke: #385170; stroke-width: 2; }
      .inheritance { fill: #fff; stroke: #385170; stroke-width: 2; }
      .label { font-size: 14px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path class="inheritance" d="M1,1 L11,6 L1,11 Z"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#385170"/>
    </marker>
  </defs>

  <!-- Jerarquía de jugadas -->
  <g>
    <rect class="abstract" x="430" y="40" width="340" height="130" rx="6"/>
    <text class="stereotype" x="600" y="64">&lt;&lt;abstracta&gt;&gt;</text>
    <text class="name" x="600" y="90">Jugada</text>
    <line class="divider" x1="430" y1="102" x2="770" y2="102"/>
    <text class="member" x="446" y="126">+ nombre: texto</text>
    <line class="divider" x1="430" y1="138" x2="770" y2="138"/>
    <text class="member" x="446" y="160">+ vence_a(otra: Jugada): booleano</text>
  </g>

  <g>
    <rect class="box" x="80" y="270" width="280" height="90" rx="6"/>
    <text class="name" x="220" y="302">Piedra</text>
    <line class="divider" x1="80" y1="316" x2="360" y2="316"/>
    <text class="member" x="94" y="343">+ vence_a(otra): booleano</text>
  </g>
  <g>
    <rect class="box" x="460" y="270" width="280" height="90" rx="6"/>
    <text class="name" x="600" y="302">Papel</text>
    <line class="divider" x1="460" y1="316" x2="740" y2="316"/>
    <text class="member" x="474" y="343">+ vence_a(otra): booleano</text>
  </g>
  <g>
    <rect class="box" x="840" y="270" width="280" height="90" rx="6"/>
    <text class="name" x="980" y="302">Tijera</text>
    <line class="divider" x1="840" y1="316" x2="1120" y2="316"/>
    <text class="member" x="854" y="343">+ vence_a(otra): booleano</text>
  </g>

  <path class="relation" marker-end="url(#inherit)" d="M220 270 V220 H560 V170"/>
  <path class="relation" marker-end="url(#inherit)" d="M600 270 V170"/>
  <path class="relation" marker-end="url(#inherit)" d="M980 270 V220 H640 V170"/>
  <text class="label" x="600" y="210">herencia</text>

  <!-- Jerarquía de jugadores -->
  <g>
    <rect class="abstract" x="90" y="470" width="320" height="120" rx="6"/>
    <text class="stereotype" x="250" y="494">&lt;&lt;abstracta&gt;&gt;</text>
    <text class="name" x="250" y="520">Jugador</text>
    <line class="divider" x1="90" y1="532" x2="410" y2="532"/>
    <text class="member" x="104" y="556">+ nombre: texto</text>
    <line class="divider" x1="90" y1="566" x2="410" y2="566"/>
    <text class="member" x="104" y="584">+ elegir_jugada(): Jugada</text>
  </g>

  <g>
    <rect class="box" x="30" y="710" width="280" height="80" rx="6"/>
    <text class="name" x="170" y="742">JugadorHumano</text>
    <line class="divider" x1="30" y1="756" x2="310" y2="756"/>
    <text class="member" x="44" y="780">+ elegir_jugada(): Jugada</text>
  </g>
  <g>
    <rect class="box" x="350" y="700" width="310" height="100" rx="6"/>
    <text class="name" x="505" y="732">Maquina</text>
    <line class="divider" x1="350" y1="746" x2="660" y2="746"/>
    <text class="member" x="364" y="770">- generador_aleatorio</text>
    <line class="divider" x1="350" y1="780" x2="660" y2="780"/>
    <text class="member" x="364" y="797">+ elegir_jugada(): Jugada</text>
  </g>
  <path class="relation" marker-end="url(#inherit)" d="M170 710 V650 H220 V590"/>
  <path class="relation" marker-end="url(#inherit)" d="M505 700 V650 H280 V590"/>

  <!-- Partida y resultado -->
  <g>
    <rect class="box" x="730" y="470" width="420" height="160" rx="6"/>
    <text class="name" x="940" y="504">Partida</text>
    <line class="divider" x1="730" y1="518" x2="1150" y2="518"/>
    <text class="member" x="746" y="544">- jugador: Jugador</text>
    <text class="member" x="746" y="568">- maquina: Maquina</text>
    <line class="divider" x1="730" y1="580" x2="1150" y2="580"/>
    <text class="member" x="746" y="604">+ jugar(): Resultado</text>
    <text class="member" x="746" y="624">- determinar_resultado(a, b): Resultado</text>
  </g>

  <g>
    <rect class="enum" x="790" y="720" width="300" height="150" rx="6"/>
    <text class="stereotype" x="940" y="744">&lt;&lt;enumeración&gt;&gt;</text>
    <text class="name" x="940" y="770">Resultado</text>
    <line class="divider" x1="790" y1="784" x2="1090" y2="784"/>
    <text class="member" x="810" y="812">VICTORIA</text>
    <text class="member" x="810" y="838">DERROTA</text>
    <text class="member" x="810" y="864">EMPATE</text>
  </g>

  <path class="relation" marker-end="url(#arrow)" d="M730 530 H410"/>
  <text class="label" x="570" y="518">utiliza</text>
  <path class="relation" marker-end="url(#arrow)" d="M940 630 V720"/>
  <text class="label" x="980" y="681">produce</text>
  <path class="relation" marker-end="url(#arrow)" d="M250 470 V405 H530 V360"/>
  <text class="label" x="385" y="394">elige</text>

  <text x="600" y="915" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#5b6577">
    Diseño modular basado en abstracción, herencia y polimorfismo
  </text>
</svg>
