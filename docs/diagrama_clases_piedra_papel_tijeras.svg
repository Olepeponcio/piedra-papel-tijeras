<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de clases de piedra, papel y tijeras</title>
  <desc id="desc">Diagrama UML de las jugadas, su fábrica, sus tipos, los jugadores, la partida y el resultado.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #172033; }
      .box { fill: #f7f9fc; stroke: #385170; stroke-width: 2; }
      .abstract { fill: #e8eef8; stroke: #385170; stroke-width: 2; }
      .enum { fill: #fff4d6; stroke: #b7791f; stroke-width: 2; }
      .name { font-size: 19px; font-weight: 700; text-anchor: middle; }
      .stereotype { font-size: 13px; font-style: italic; text-anchor: middle; }
      .member { font-size: 14px; }
      .divider { stroke: #385170; stroke-width: 1.5; }
      .relation { fill: none; stroke: #385170; stroke-width: 2; }
      .rule { fill: none; stroke: #8a5a18; stroke-width: 1.8; stroke-dasharray: 7 5; }
      .inheritance { fill: #fff; stroke: #385170; stroke-width: 2; }
      .label { font-size: 13px; font-weight: 700; text-anchor: middle; }
      .section { font-size: 18px; font-weight: 700; fill: #385170; }
      .footnote { font-size: 14px; text-anchor: middle; fill: #5b6577; }
    </style>
    <marker id="inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path class="inheritance" d="M1,1 L11,6 L1,11 Z"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#385170"/>
    </marker>
    <marker id="rule-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8a5a18"/>
    </marker>
  </defs>

  <text class="section" x="40" y="35">models/jugadas: jerarquía, fábrica y reglas</text>

  <g>
    <rect class="enum" x="40" y="65" width="270" height="170" rx="6"/>
    <text class="stereotype" x="175" y="89">&lt;&lt;enumeración&gt;&gt;</text>
    <text class="name" x="175" y="115">TipoJugada</text>
    <line class="divider" x1="40" y1="128" x2="310" y2="128"/>
    <text class="member" x="56" y="153">PIEDRA = "Piedra"</text>
    <text class="member" x="56" y="178">PAPEL = "Papel"</text>
    <text class="member" x="56" y="203">TIJERAS = "Tijeras"</text>
    <line class="divider" x1="40" y1="214" x2="310" y2="214"/>
    <text class="member" x="56" y="231">+ __str__(): str</text>
  </g>

  <g>
    <rect class="abstract" x="465" y="55" width="470" height="205" rx="6"/>
    <text class="stereotype" x="700" y="79">&lt;&lt;abstracta&gt;&gt;</text>
    <text class="name" x="700" y="105">Jugada</text>
    <line class="divider" x1="465" y1="118" x2="935" y2="118"/>
    <text class="member" x="481" y="143">+ tipo: TipoJugada {abstracta}</text>
    <text class="member" x="481" y="168">+ nombre: str {abstracta}</text>
    <text class="member" x="481" y="193"># _vence_a_tipo: TipoJugada {abstracta}</text>
    <line class="divider" x1="465" y1="207" x2="935" y2="207"/>
    <text class="member" x="481" y="232">+ vence_a(otra: Jugada): bool</text>
    <text class="member" x="481" y="253">+ __str__(): str</text>
  </g>

  <path class="relation" marker-end="url(#arrow)" d="M465 150 H310"/>
  <text class="label" x="388" y="139">utiliza</text>

  <g>
    <rect class="box" x="1010" y="65" width="350" height="155" rx="6"/>
    <text class="stereotype" x="1185" y="89">&lt;&lt;fábrica&gt;&gt;</text>
    <text class="name" x="1185" y="115">FabricaJugadas</text>
    <line class="divider" x1="1010" y1="128" x2="1360" y2="128"/>
    <text class="member" x="1026" y="157">- _CONSTRUCTORES: dict</text>
    <line class="divider" x1="1010" y1="172" x2="1360" y2="172"/>
    <text class="member" x="1026" y="201">+ crear_jugada(tipo: TipoJugada): Jugada</text>
  </g>

  <path class="relation" marker-end="url(#arrow)" d="M1010 105 H935"/>
  <text class="label" x="973" y="94">devuelve</text>
  <path class="relation" marker-end="url(#arrow)" d="M1010 145 H965 V285 H175 V235"/>
  <text class="label" x="565" y="276">recibe TipoJugada</text>

  <g>
    <rect class="box" x="80" y="385" width="340" height="145" rx="6"/>
    <text class="name" x="250" y="417">Piedra</text>
    <line class="divider" x1="80" y1="431" x2="420" y2="431"/>
    <text class="member" x="96" y="456">+ tipo: TipoJugada.PIEDRA</text>
    <text class="member" x="96" y="481">+ nombre: str</text>
    <text class="member" x="96" y="506"># _vence_a_tipo: TipoJugada.TIJERAS</text>
  </g>

  <g>
    <rect class="box" x="530" y="385" width="340" height="145" rx="6"/>
    <text class="name" x="700" y="417">Papel</text>
    <line class="divider" x1="530" y1="431" x2="870" y2="431"/>
    <text class="member" x="546" y="456">+ tipo: TipoJugada.PAPEL</text>
    <text class="member" x="546" y="481">+ nombre: str</text>
    <text class="member" x="546" y="506"># _vence_a_tipo: TipoJugada.PIEDRA</text>
  </g>

  <g>
    <rect class="box" x="980" y="385" width="340" height="145" rx="6"/>
    <text class="name" x="1150" y="417">Tijeras</text>
    <line class="divider" x1="980" y1="431" x2="1320" y2="431"/>
    <text class="member" x="996" y="456">+ tipo: TipoJugada.TIJERAS</text>
    <text class="member" x="996" y="481">+ nombre: str</text>
    <text class="member" x="996" y="506"># _vence_a_tipo: TipoJugada.PAPEL</text>
  </g>

  <path class="relation" marker-end="url(#inherit)" d="M250 385 V325 H650 V260"/>
  <path class="relation" marker-end="url(#inherit)" d="M700 385 V260"/>
  <path class="relation" marker-end="url(#inherit)" d="M1150 385 V325 H750 V260"/>
  <text class="label" x="700" y="315">herencia</text>

  <path class="relation" marker-end="url(#arrow)" d="M1090 220 V350 H250 V385"/>
  <path class="relation" marker-end="url(#arrow)" d="M1185 220 V350 H700 V385"/>
  <path class="relation" marker-end="url(#arrow)" d="M1280 220 V350 H1150 V385"/>
  <text class="label" x="1185" y="340">crea</text>

  <path class="rule" marker-end="url(#rule-arrow)" d="M250 530 V585 H1150 V530"/>
  <text class="label" x="700" y="578">vence a</text>
  <path class="rule" marker-end="url(#rule-arrow)" d="M530 455 H420"/>
  <text class="label" x="475" y="444">vence a</text>
  <path class="rule" marker-end="url(#rule-arrow)" d="M980 485 H870"/>
  <text class="label" x="925" y="474">vence a</text>

  <text class="section" x="40" y="630">Jugadores, partida y resultado</text>

  <g>
    <rect class="abstract" x="80" y="665" width="320" height="130" rx="6"/>
    <text class="stereotype" x="240" y="689">&lt;&lt;abstracta&gt;&gt;</text>
    <text class="name" x="240" y="715">Jugador</text>
    <line class="divider" x1="80" y1="728" x2="400" y2="728"/>
    <text class="member" x="96" y="753">+ nombre: str</text>
    <line class="divider" x1="80" y1="766" x2="400" y2="766"/>
    <text class="member" x="96" y="788">+ elegir_jugada(): Jugada</text>
  </g>

  <g>
    <rect class="box" x="35" y="930" width="280" height="85" rx="6"/>
    <text class="name" x="175" y="962">JugadorHumano</text>
    <line class="divider" x1="35" y1="976" x2="315" y2="976"/>
    <text class="member" x="51" y="1001">+ elegir_jugada(): Jugada</text>
  </g>

  <g>
    <rect class="box" x="350" y="910" width="330" height="125" rx="6"/>
    <text class="name" x="515" y="942">Maquina</text>
    <line class="divider" x1="350" y1="956" x2="680" y2="956"/>
    <text class="member" x="366" y="981">- generador_aleatorio</text>
    <line class="divider" x1="350" y1="994" x2="680" y2="994"/>
    <text class="member" x="366" y="1019">+ elegir_jugada(): Jugada</text>
  </g>

  <path class="relation" marker-end="url(#inherit)" d="M175 930 V850 H215 V795"/>
  <path class="relation" marker-end="url(#inherit)" d="M515 910 V850 H265 V795"/>

  <g>
    <rect class="box" x="805" y="665" width="520" height="180" rx="6"/>
    <text class="name" x="1065" y="697">Partida</text>
    <line class="divider" x1="805" y1="711" x2="1325" y2="711"/>
    <text class="member" x="821" y="738">- jugador: Jugador</text>
    <text class="member" x="821" y="763">- maquina: Maquina</text>
    <line class="divider" x1="805" y1="777" x2="1325" y2="777"/>
    <text class="member" x="821" y="803">+ jugar(): Resultado</text>
    <text class="member" x="821" y="828">- determinar_resultado(a: Jugada, b: Jugada): Resultado</text>
  </g>

  <g>
    <rect class="enum" x="880" y="925" width="370" height="150" rx="6"/>
    <text class="stereotype" x="1065" y="949">&lt;&lt;enumeración&gt;&gt;</text>
    <text class="name" x="1065" y="975">Resultado</text>
    <line class="divider" x1="880" y1="988" x2="1250" y2="988"/>
    <text class="member" x="900" y="1015">VICTORIA</text>
    <text class="member" x="900" y="1040">DERROTA</text>
    <text class="member" x="900" y="1065">EMPATE</text>
  </g>

  <path class="relation" marker-end="url(#arrow)" d="M805 730 H400"/>
  <text class="label" x="602" y="719">utiliza</text>
  <path class="relation" marker-end="url(#arrow)" d="M1065 845 V925"/>
  <text class="label" x="1100" y="890">produce</text>
  <path class="relation" marker-end="url(#arrow)" d="M240 665 V605 H610 V530"/>
  <text class="label" x="425" y="594">elige Jugada</text>

  <text class="footnote" x="700" y="1105">La fábrica centraliza la creación; Jugada y sus clases hijas conservan sus responsabilidades</text>
</svg>
