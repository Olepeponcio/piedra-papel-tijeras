<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" viewBox="0 0 1500 1500" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de clases de la aplicación PySide6</title>
  <desc id="desc">Clases y relaciones entre la capa de presentación PySide6, los jugadores, la fábrica de jugadas, Partida y ResultadoDeLaRonda.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #172033; }
      .title { font-size: 28px; font-weight: 700; text-anchor: middle; }
      .subtitle { font-size: 16px; fill: #5b6577; text-anchor: middle; }
      .lane { fill: none; stroke-width: 2; stroke-dasharray: 8 6; rx: 12; }
      .lane-title { font-size: 19px; font-weight: 700; }
      .box { fill: #f7f9fc; stroke: #385170; stroke-width: 2; }
      .gui { fill: #e9f3ff; stroke: #2463a7; stroke-width: 2; }
      .domain { fill: #fff4d6; stroke: #b7791f; stroke-width: 2; }
      .value { fill: #e6f6ee; stroke: #27845b; stroke-width: 2; }
      .abstract { fill: #e8eef8; stroke: #385170; stroke-width: 2; }
      .name { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .stereotype { font-size: 13px; font-style: italic; text-anchor: middle; }
      .member { font-size: 14px; }
      .divider { stroke: #385170; stroke-width: 1.4; }
      .relation { fill: none; stroke: #385170; stroke-width: 2; marker-end: url(#arrow); }
      .dependency { fill: none; stroke: #2463a7; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#blue-arrow); }
      .inheritance { fill: none; stroke: #385170; stroke-width: 2; marker-end: url(#inherit); }
      .label { font-size: 13px; font-weight: 700; text-anchor: middle; fill: #385170; }
      .footnote { font-size: 14px; text-anchor: middle; fill: #5b6577; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#385170"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2463a7"/>
    </marker>
    <marker id="inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#fff" stroke="#385170" stroke-width="2"/>
    </marker>
  </defs>

  <text class="title" x="750" y="40">Diagrama de clases — aplicación PySide6</text>
  <text class="subtitle" x="750" y="68">Composición, presentación y reutilización del dominio</text>

  <rect class="lane" x="35" y="95" width="1430" height="475" stroke="#2463a7"/>
  <text class="lane-title" x="55" y="125" fill="#2463a7">Presentación y composición</text>

  <rect class="lane" x="35" y="600" width="1430" height="830" stroke="#b7791f"/>
  <text class="lane-title" x="55" y="630" fill="#8a5a18">Dominio reutilizable</text>

  <g>
    <rect class="gui" x="70" y="175" width="330" height="165" rx="7"/>
    <text class="stereotype" x="235" y="199">&lt;&lt;módulo de composición&gt;&gt;</text>
    <text class="name" x="235" y="225">main.py</text>
    <line class="divider" x1="70" y1="239" x2="400" y2="239"/>
    <text class="member" x="88" y="265">+ main_pyside6(): None</text>
    <text class="member" x="88" y="290">+ main_consola(): None</text>
    <text class="member" x="88" y="315">+ main(): None</text>
  </g>

  <g>
    <rect class="gui" x="515" y="130" width="570" height="390" rx="7"/>
    <text class="stereotype" x="800" y="154">&lt;&lt;QMainWindow&gt;&gt;</text>
    <text class="name" x="800" y="180">VentanaDeJuego</text>
    <line class="divider" x1="515" y1="194" x2="1085" y2="194"/>
    <text class="member" x="535" y="220">- _jugador_humano: JugadorHumano</text>
    <text class="member" x="535" y="245">- _partida: Partida</text>
    <text class="member" x="535" y="270">- _resultado_ronda_actual: ResultadoDeLaRonda?</text>
    <text class="member" x="535" y="295">- _ARCHIVOS_JUGADA: dict[TipoJugada, str]</text>
    <text class="member" x="535" y="320">- _ARCHIVOS_RESULTADO: dict[Resultado, str]</text>
    <line class="divider" x1="515" y1="334" x2="1085" y2="334"/>
    <text class="member" x="535" y="360">- _seleccionar_jugada(tipo: TipoJugada): None</text>
    <text class="member" x="535" y="385">- _ejecutar_ronda(): None</text>
    <text class="member" x="535" y="410">- _mostrar_jugada(tipo, contenedor): None</text>
    <text class="member" x="535" y="435">- _mostrar_resultado(): None</text>
    <text class="member" x="535" y="460">- _preparar_seleccion_siguiente_ronda(): None</text>
    <text class="member" x="535" y="485">+ señales Qt / QTimer</text>
  </g>

  <g>
    <rect class="gui" x="1190" y="190" width="230" height="140" rx="7"/>
    <text class="stereotype" x="1305" y="214">&lt;&lt;Qt&gt;&gt;</text>
    <text class="name" x="1305" y="240">Controles</text>
    <line class="divider" x1="1190" y1="254" x2="1420" y2="254"/>
    <text class="member" x="1208" y="280">QPushButton</text>
    <text class="member" x="1208" y="305">QLabel / QTimer</text>
  </g>

  <g>
    <rect class="abstract" x="80" y="690" width="350" height="175" rx="7"/>
    <text class="stereotype" x="255" y="714">&lt;&lt;abstracta&gt;&gt;</text>
    <text class="name" x="255" y="740">Jugador</text>
    <line class="divider" x1="80" y1="754" x2="430" y2="754"/>
    <text class="member" x="98" y="780">+ nombre: str</text>
    <line class="divider" x1="80" y1="794" x2="430" y2="794"/>
    <text class="member" x="98" y="820"># _seleccionar_tipo(): TipoJugada</text>
    <text class="member" x="98" y="845">+ elegir_jugada(): Jugada</text>
  </g>

  <g>
    <rect class="domain" x="55" y="1000" width="390" height="190" rx="7"/>
    <text class="name" x="250" y="1032">JugadorHumano</text>
    <line class="divider" x1="55" y1="1046" x2="445" y2="1046"/>
    <text class="member" x="73" y="1072">- _tipo_seleccionado: TipoJugada?</text>
    <line class="divider" x1="55" y1="1086" x2="445" y2="1086"/>
    <text class="member" x="73" y="1112">+ registrar_seleccion(tipo): None</text>
    <text class="member" x="73" y="1137"># _seleccionar_tipo(): TipoJugada</text>
    <text class="member" x="73" y="1162">+ elegir_jugada(): Jugada [heredado]</text>
  </g>

  <g>
    <rect class="domain" x="500" y="1000" width="350" height="165" rx="7"/>
    <text class="name" x="675" y="1032">JugadorMaquina</text>
    <line class="divider" x1="500" y1="1046" x2="850" y2="1046"/>
    <text class="member" x="518" y="1072">- _generador: Random</text>
    <text class="member" x="518" y="1097">- _jugadas: tuple[TipoJugada, ...]</text>
    <line class="divider" x1="500" y1="1111" x2="850" y2="1111"/>
    <text class="member" x="518" y="1137"># _seleccionar_tipo(): TipoJugada</text>
  </g>

  <g>
    <rect class="domain" x="525" y="680" width="410" height="205" rx="7"/>
    <text class="name" x="730" y="712">Partida</text>
    <line class="divider" x1="525" y1="726" x2="935" y2="726"/>
    <text class="member" x="543" y="752">- _jugador_humano: Jugador</text>
    <text class="member" x="543" y="777">- _jugador_maquina: Jugador</text>
    <line class="divider" x1="525" y1="791" x2="935" y2="791"/>
    <text class="member" x="543" y="817">+ jugar(): ResultadoDeLaRonda</text>
    <text class="member" x="543" y="842">- compara ambas Jugada</text>
    <text class="member" x="543" y="867">- resultado desde perspectiva humana</text>
  </g>

  <g>
    <rect class="domain" x="1010" y="675" width="390" height="190" rx="7"/>
    <text class="stereotype" x="1205" y="699">&lt;&lt;fábrica&gt;&gt;</text>
    <text class="name" x="1205" y="725">FabricaJugadas</text>
    <line class="divider" x1="1010" y1="739" x2="1400" y2="739"/>
    <text class="member" x="1028" y="765">- _CONSTRUCTORES: dict</text>
    <line class="divider" x1="1010" y1="779" x2="1400" y2="779"/>
    <text class="member" x="1028" y="805">+ crear_jugada(tipo): Jugada</text>
    <text class="member" x="1028" y="830">+ crea Piedra, Papel o Tijeras</text>
  </g>

  <g>
    <rect class="value" x="930" y="965" width="470" height="175" rx="7"/>
    <text class="stereotype" x="1165" y="989">&lt;&lt;dataclass inmutable&gt;&gt;</text>
    <text class="name" x="1165" y="1015">ResultadoDeLaRonda</text>
    <line class="divider" x1="930" y1="1029" x2="1400" y2="1029"/>
    <text class="member" x="948" y="1055">+ jugada_humana: Jugada</text>
    <text class="member" x="948" y="1080">+ jugada_maquina: Jugada</text>
    <text class="member" x="948" y="1105">+ resultado: Resultado</text>
  </g>

  <g>
    <rect class="value" x="930" y="1210" width="220" height="150" rx="7"/>
    <text class="stereotype" x="1040" y="1234">&lt;&lt;enum&gt;&gt;</text>
    <text class="name" x="1040" y="1260">Resultado</text>
    <line class="divider" x1="930" y1="1274" x2="1150" y2="1274"/>
    <text class="member" x="948" y="1300">VICTORIA</text>
    <text class="member" x="948" y="1325">DERROTA / EMPATE</text>
  </g>

  <g>
    <rect class="value" x="1180" y="1210" width="220" height="150" rx="7"/>
    <text class="stereotype" x="1290" y="1234">&lt;&lt;enum&gt;&gt;</text>
    <text class="name" x="1290" y="1260">TipoJugada</text>
    <line class="divider" x1="1180" y1="1274" x2="1400" y2="1274"/>
    <text class="member" x="1198" y="1300">PIEDRA / PAPEL</text>
    <text class="member" x="1198" y="1325">TIJERAS</text>
  </g>

