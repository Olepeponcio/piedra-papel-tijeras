<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1500" viewBox="0 0 1100 1500" role="img" aria-labelledby="title desc">
  <title id="title">Flujo completo de la aplicación PySide6</title>
  <desc id="desc">Flujo desde main_pyside6 y VentanaDeJuego hasta la creación de jugadas, el resultado de ronda, el temporizador y la siguiente ronda.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #172033; text-anchor: middle; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #5b6577; }
      .node { fill: #f7f9fc; stroke: #385170; stroke-width: 2; }
      .gui { fill: #e9f3ff; stroke: #2463a7; stroke-width: 2; }
      .domain { fill: #fff4d6; stroke: #b7791f; stroke-width: 2; }
      .result { fill: #e6f6ee; stroke: #27845b; stroke-width: 2; }
      .decision { fill: #fff4d6; stroke: #b7791f; stroke-width: 2; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 14px; }
      .line { fill: none; stroke: #385170; stroke-width: 2; marker-end: url(#arrow); }
      .return { fill: none; stroke: #27845b; stroke-width: 2; stroke-dasharray: 8 5; marker-end: url(#green-arrow); }
      .lane { fill: none; stroke-width: 2; stroke-dasharray: 7 6; rx: 12; }
      .lane-title { font-size: 18px; font-weight: 700; text-anchor: start; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#385170"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#27845b"/>
    </marker>
  </defs>

  <text class="title" x="550" y="42">Flujo de aplicación — PySide6</text>
  <text class="subtitle" x="550" y="70">Presentación, coordinación del dominio y preparación de la siguiente ronda</text>

  <rect class="lane" x="45" y="95" width="1010" height="455" stroke="#2463a7"/>
  <text class="lane-title" x="65" y="125" fill="#2463a7">Presentación · main.py / VentanaDeJuego</text>

  <rect class="lane" x="45" y="575" width="1010" height="455" stroke="#b7791f"/>
  <text class="lane-title" x="65" y="605" fill="#8a5a18">Dominio · jugadores / fábrica / Partida</text>

  <rect class="lane" x="45" y="1055" width="1010" height="390" stroke="#27845b"/>
  <text class="lane-title" x="65" y="1085" fill="#27845b">Presentación del resultado · VentanaDeJuego / QTimer</text>

  <ellipse class="node" cx="550" cy="145" rx="145" ry="34"/>
  <text class="label" x="550" y="151">main_pyside6()</text>

  <rect class="gui" x="360" y="210" width="380" height="72" rx="10"/>
  <text class="label" x="550" y="239">Crear QApplication, jugadores,</text>
  <text class="small" x="550" y="263">Partida y VentanaDeJuego</text>

  <rect class="gui" x="360" y="320" width="380" height="70" rx="10"/>
  <text class="label" x="550" y="349">Usuario pulsa una jugada</text>
  <text class="small" x="550" y="373">Piedra, papel o tijeras</text>

  <rect class="gui" x="300" y="430" width="500" height="78" rx="10"/>
  <text class="label" x="550" y="459">VentanaDeJuego._seleccionar_jugada()</text>
  <text class="small" x="550" y="483">registrar_seleccion(tipo) y activar ¡Bo!</text>

  <rect class="domain" x="315" y="635" width="470" height="72" rx="10"/>
  <text class="label" x="550" y="664">Usuario pulsa ¡Bo! → Partida.jugar()</text>
  <text class="small" x="550" y="688">Solicita una jugada a cada jugador</text>

  <rect class="domain" x="105" y="755" width="390" height="94" rx="10"/>
  <text class="label" x="300" y="783">JugadorHumano.elegir_jugada()</text>
  <text class="small" x="300" y="807">consume _tipo_seleccionado</text>
  <text class="small" x="300" y="829">y exige una selección nueva por ronda</text>

  <rect class="domain" x="605" y="755" width="390" height="94" rx="10"/>
  <text class="label" x="800" y="783">JugadorMaquina.elegir_jugada()</text>
  <text class="small" x="800" y="807">selecciona un TipoJugada</text>
  <text class="small" x="800" y="829">mediante el generador aleatorio</text>

  <rect class="domain" x="345" y="895" width="410" height="78" rx="10"/>
  <text class="label" x="550" y="924">crear_jugada(TipoJugada)</text>
  <text class="small" x="550" y="948">fábrica → Piedra, Papel o Tijeras</text>

  <rect class="result" x="310" y="1105" width="480" height="82" rx="10"/>
  <text class="label" x="550" y="1134">Partida devuelve ResultadoDeLaRonda</text>
  <text class="small" x="550" y="1159">jugada humana · jugada máquina · resultado</text>

  <rect class="gui" x="315" y="1225" width="470" height="72" rx="10"/>
  <text class="label" x="550" y="1254">Ventana muestra ambas jugadas</text>
  <text class="small" x="550" y="1278">y bloquea temporalmente los controles</text>

  <rect class="gui" x="315" y="1330" width="470" height="72" rx="10"/>
  <text class="label" x="550" y="1359">QTimer muestra el resultado</text>
  <text class="small" x="550" y="1383">y prepara la selección de la siguiente ronda</text>

  <path class="line" d="M550 179 V210"/>
  <path class="line" d="M550 282 V320"/>
  <path class="line" d="M550 390 V430"/>
  <path class="line" d="M550 508 V635"/>
  <path class="line" d="M500 707 L340 755"/>
  <path class="line" d="M600 707 L760 755"/>
  <path class="line" d="M300 849 V875 H500 V895"/>
  <path class="line" d="M800 849 V875 H600 V895"/>
  <path class="line" d="M550 973 V1105"/>
  <path class="line" d="M550 1187 V1225"/>
  <path class="line" d="M550 1297 V1330"/>
  <path class="return" d="M315 1366 H80 V355 H360"/>
  <text class="small" x="170" y="1348" fill="#27845b">siguiente ronda</text>
</svg>
